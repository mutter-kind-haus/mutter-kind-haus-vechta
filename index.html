<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mutter-Kind-Haus Vechta</title>
<style>
.topbar{position:sticky;top:0;display:flex;justify-content:space-between;height:56px;padding:0 20px;background:#fff;border-bottom:1px solid #E8DDD3}
.menu-btn{background:#1A1A1A;color:#fff;padding:10px 18px;border-radius:20px;border:none;font-weight:800;cursor:pointer}
.drawer{position:fixed;top:0;right:-100%;width:340px;height:100vh;background:#fff;box-shadow:-10px 0 40px rgba(0,0,0,0.15);z-index:100;transition:0.4s;padding:20px}
.drawer.open{right:0}
.hero-img{width:100%;border-radius:24px}
.big{margin:12px 0;border:1px solid #EDE4D8;border-radius:14px;overflow:hidden}
.big-head{padding:18px 20px;background:#FFF8E0;cursor:pointer;display:flex;justify-content:space-between}
.big-body{max-height:0;overflow:hidden;transition:0.45s} .big.open .big-body{max-height:5000px}
</style>
</head>
<body>
<div class="topbar"><div>Mutter-Kind-Haus Vechta</div><button class="menu-btn" onclick="openDrawer()">☰ Menu</button></div>
<div id="drawer" class="drawer"><!-- كل العناوين الكبرى هنا --></div>
<div class="wrap">
<div class="hero"><h1>Mutter-Kind-Haus Vechta</h1><img class="hero-img" src="Bild1.jpg"></div>
<!-- باقي المحتوى -->
</div>
</body>
</html>
