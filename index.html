let L='de';try{L=localStorage.getItem('lang')||'de'}catch(e){}

const UI={
tag:{de:'Seit 1999 · Graskamp 3',en:'Since 1999 · Graskamp 3'},
lead:{de:'Leitung',en:'Head of facility'},
eyebrow:{de:'Aufnahme nach §19 SGB VIII',en:'Admission under §19 SGB VIII'},
h1:{de:'Ein sicherer Anfang darf klein beginnen.',en:'A safe start can begin small.'},
hp:{de:'Ein Ort für neue Wege: Wir begleiten junge Mütter und ihre Kinder zu mehr Sicherheit und Selbstständigkeit.',en:'A place for new paths: we support young mothers and their children towards safety and independence.'},
badge:{de:'Ein Ort für neue Wege ✨',en:'A place for new paths ✨'},
call:{de:'Anrufen',en:'Call'},map:{de:'Route planen',en:'Get directions'},
offer:{de:'Was wir bieten',en:'What we offer'},h2a:{de:'Unterstützung, die zum Leben passt.',en:'Support that fits real life.'},
pa:{de:'Informationen zur Einrichtung, unserem Angebot und dem ersten Kontakt.',en:'Information about the facility, our services and first contact.'},
c1t:{de:'Wohnen',en:'Accommodation'},c1p:{de:'Ein geschützter Wohnraum mit stabilem, familiengerechtem Umfeld.',en:'A protected home with a stable, family-friendly environment.'},
c2t:{de:'Pädagogische Unterstützung',en:'Educational support'},c2p:{de:'Hilfe bei Alltag, Erziehung, Selbstständigkeit und persönlichen Zielen.',en:'Help with daily life, parenting, independence and personal goals.'},
c3t:{de:'Psychologische Begleitung',en:'Psychological support'},c3p:{de:'Professionelle Begleitung zur Stabilisierung und Entwicklung.',en:'Professional support for stability and personal development.'},
contact:{de:'Kontakt',en:'Contact'},h2c:{de:'Wir sind für Sie da.',en:'We are here for you.'},
pc:{de:'Sie möchten mehr über unsere Einrichtung erfahren? Kontaktieren Sie uns gerne.',en:'Would you like to learn more about our facility? Please get in touch.'},
back:{de:'Zurück',en:'Back'},legal:{de:'Rechtliches',en:'Legal'}
};

const G=[
{de:'Die Einrichtung',en:'The Facility',k:['raeume','fuerwen','zeiten','voraus']},
{de:'Was wir bieten',en:'What we offer',k:['konzept','paed','psych','grund','qual']},
{de:'Das Team',en:'The Team',k:['wir','team','netz']},
{de:'Kontakt',en:'Contact',k:['kontakt','impressum']},
{de:'Infos',en:'Info',k:['stellen','datenschutz']}
];

const P={
raeume:{
de:['Räumlichkeiten',`<p>Das Mutter-Kind-Haus Vechta wurde 1999 erbaut und ist Bestandteil einer Wohnsiedlung. Die Innenstadt Vechtas ist in 15 Min. zu Fuß zu erreichen. Das Haus verfügt über 5 Wohnungen (2 Zimmer, 1 Flur und 1 Bad, Fläche ca. 36 qm). Weiterhin stehen den Bewohnerinnen mit ihren Kindern ein großer Krabbelraum, eine große Gemeinschaftsküche, ein gemütlicher Aufenthaltsraum, ein Hauswirtschafts- und Vorratsraum sowie ein großer Garten mit geschlossenem Carport zur Verfügung. Alle wichtigen Behörden, weiterführende Schulen und zahlreiche Möglichkeiten zur Berufsausbildung sind in der Stadt Vechta vorhanden und gut zu erreichen.</p><div class="tags"><span>5 Wohnungen</span><span>36 m²</span><span>Krabbelraum</span><span>Gemeinschaftsküche</span><span>Aufenthaltsraum</span><span>Hauswirtschaft</span><span>Garten + Carport</span><span>15 Min. Innenstadt</span></div>`],
en:['Premises',`<p>The Mutter-Kind-Haus Vechta was built in 1999 and is part of a residential neighbourhood. Vechta's town centre is a 15-minute walk away. The house has 5 apartments (2 rooms, 1 hallway and 1 bathroom, approx. 36 sqm). Residents and their children also have a large crawling room, a large shared kitchen, a cosy common room, a utility and storage room, and a large garden with an enclosed carport. All major authorities, secondary schools and numerous vocational training opportunities are located in Vechta and easy to reach.</p><div class="tags"><span>5 apartments</span><span>36 m²</span><span>Crawling room</span><span>Shared kitchen</span><span>Common room</span><span>Utility room</span><span>Garden + carport</span><span>15 min to centre</span></div>`]},
fuerwen:{
de:['Für wen sind wir da',`<p>Unsere pädagogischen und psychologischen Angebote orientieren sich an jungen Schwangeren / Müttern mit ihren Kindern, die durch die Pflege und Erziehung eines Kindes vorübergehend überfordert sind und die auf Grund ihrer persönlichen und sozialen Problematik noch nicht in der Lage sind, allein die alltäglichen Aufgaben zu bewältigen. Sie erfahren bei uns eine behutsame und klar strukturierte Unterstützung, um in ihre Rolle hineinzufinden.</p>`],
en:['Who we are here for',`<p>Our educational and psychological services are aimed at young pregnant women / mothers and their children who are temporarily overwhelmed by caring for and raising a child and who, due to personal and social difficulties, are not yet able to manage everyday tasks alone. They receive careful, clearly structured support to grow into their role.</p>`]},
zeiten:{
de:['Betreuungszeiten',`<p>Wir gewähren von Montag bis Freitag Betreuung vor Ort von <strong>7.00 - 22.00 Uhr</strong>. Die Betreuungszeiten werden morgens flexibel gehandhabt. Bei Bedarf (Schule, Ausbildung) werden die Zeiten individuell angepasst. An den Wochenenden sind wir von <strong>18.00 - 22.00 Uhr</strong> vor Ort.</p><p>Bei erhöhtem Betreuungsbedarf gestalten wir die Zeiten flexibel.</p><p>Außerhalb der Betreuungszeit ist ein Rufdienst eingeschaltet, so dass stets jemand zu erreichen ist.</p>`],
en:['Care hours',`<p>From Monday to Friday we provide on-site care from <strong>7:00 am - 10:00 pm</strong>. Morning hours are handled flexibly. If needed (school, training), the hours are adjusted individually. On weekends we are on site from <strong>6:00 pm - 10:00 pm</strong>.</p><p>If there is increased need for care, we arrange the hours flexibly.</p><p>Outside care hours an on-call service is active, so someone can always be reached.</p>`]},
voraus:{
de:['Voraussetzungen',`<p><strong>Aufnahmeverfahren:</strong></p><p>Das Gespräch mit der jungen Mutter erfolgt nach Absprache mit dem zuständigen Jugendamt. Im Mutter-Kind-Haus kann sich die junge Erwachsene ein Bild von der Einrichtung machen und für sich klären, ob sie sich mit den Anforderungen und Zielsetzungen der Einrichtung einverstanden erklären kann.</p><p>Sehr wichtig ist uns die Bereitschaft zu einer Schulausbildung oder einer anderen Tätigkeit sowie über Praktika Erfahrungen zu sammeln. Dies schließt auch ein, dass die junge Frau bereit ist, eine einfache Tätigkeit aufzunehmen, um sich an die Kosten der Unterkunft zu beteiligen.</p><p><strong>Grundlage für eine Aufnahme bilden §19, §34 und § 41 SGB VIII</strong></p>`],
en:['Requirements',`<p><strong>Admission procedure:</strong></p><p>The conversation with the young mother takes place in agreement with the responsible youth welfare office. At the Mutter-Kind-Haus the young adult can get an impression of the facility and decide whether she agrees with its requirements and goals.</p><p>We consider it very important that she is willing to pursue school education or another activity and to gather experience through internships. This also includes willingness to take on a simple job to contribute to the cost of accommodation.</p><p><strong>Admission is based on §19, §34 and §41 SGB VIII</strong></p>`]},
konzept:{
de:['Konzeptionelle Grundlagen',`<p>In unserer Einrichtung wird minderjährigen Müttern bzw. Schwangeren in problematischer Lebenssituation, die zur Zeit den Alltag nicht allein bewältigen können für eine Übergangszeit ermöglicht, mit unserer Unterstützung erfolgreich in die neue Rolle hinein zu finden. Über das Aktivieren ihrer eigenen Ressourcen und Erwerben neuen Wissens lernen sie in der Zeit bei uns, den Herausforderungen zu begegnen und die Zukunft erfolgreich zu gestalten. Die Einrichtung verfügt über 5 Plätze (5 Mütter, 5 Kinder).</p><p><strong>Grundlage für unsere Tätigkeit bilden §19, §34 und § 41 SGB VIII.</strong></p><p><strong>Einzugsbereich:</strong> Der Einzugsbereich erstreckt sich vorrangig auf den Landkreis Vechta, die angrenzenden Landkreise in Niedersachsen sowie benachbarte Bundesländer.</p>`],
en:['Conceptual foundations',`<p>In our facility, underage mothers and pregnant women in difficult life situations who currently cannot manage everyday life alone are given the opportunity, for a transitional period, to successfully grow into their new role with our support. By activating their own resources and acquiring new knowledge, they learn during their time with us to face challenges and shape their future successfully. The facility has 5 places (5 mothers, 5 children).</p><p><strong>Our work is based on §19, §34 and §41 SGB VIII.</strong></p><p><strong>Catchment area:</strong> The catchment area primarily covers the district of Vechta, the neighbouring districts in Lower Saxony and neighbouring federal states.</p>`]},
paed:{
de:['Pädagogische Zielsetzung',`<p>Im Vordergrund steht die Förderung der Mutter-Kind-Beziehung und das Lernen eines eigenverantwortlichen und selbstständigen Lebens mit dem Kind. Im Mutter-Kind-Haus erhalten die jungen Frauen Unterstützung und Motivation. Die individuell vorhandenen Ressourcen sollen aktiviert werden um ggf. vorhandene destruktive Verhaltensmuster wie Nachlässigkeit, Unpünktlichkeit, Gleichgültigkeit u.v.m. in positive zu überführen. Das bedeutet, dass Auseinandersetzungen stattfinden um so Entwicklungsprozesse zu initiieren. Durch Einzelgespräche und technische Aufzeichnung bestimmter Momente sollen die jungen Frauen ihre Verhaltensweisen überprüfen, einschätzen und beurteilen lernen.</p><p>Über Zukunftsperspektiven wird eingehend gesprochen und beraten. Den jungen Frauen wird die große Bedeutung eines Schulabschlusses und einer Berufsausbildung vermittelt. Sie werden gefördert und ermuntert, Praktika zu absolvieren um eine fundierte Entscheidung für eine spätere Tätigkeit treffen zu können. Wir legen auch Wert darauf, dass unsere Bewohnerinnen sich durch leichte Tätigkeiten an den Kosten ihrer Unterbringung im Mutter-Kind-Haus beteiligen.</p><p>Die jungen Frauen erstellen gemeinsam einen Plan, nach dem sie ihre Aufgaben erledigen. Hierbei werden gruppendynamische Prozesse angestoßen und somit das soziale Verhalten untereinander gefördert und geübt.</p><p>Durch Anleitung und Nachahmung lernen sie den altersentsprechenden Umgang mit ihrem Kind. Wichtig dabei ist förderliches Spielmaterial, täglicher Aufenthalt an der frischen Luft und viel Bewegung. Erwartungshaltungen und Ansprüche an das Kind werden kontrolliert und besprochen.</p>`],
en:['Educational goals',`<p>The focus is on promoting the mother-child relationship and learning a responsible and independent life with the child. At the Mutter-Kind-Haus the young women receive support and motivation. Their individual resources are to be activated in order to turn any destructive behaviour patterns such as carelessness, unpunctuality, indifference and more into positive ones. This means that disagreements are addressed in order to initiate developmental processes. Through individual talks and technical recording of certain moments, the young women learn to review, assess and evaluate their behaviour.</p><p>Future prospects are discussed and advised on in detail. The young women are made aware of the great importance of a school qualification and vocational training. They are supported and encouraged to complete internships so they can make an informed decision about a future occupation. We also value that our residents contribute to the cost of their accommodation through light work.</p><p>The young women jointly draw up a plan according to which they carry out their tasks. This sets group-dynamic processes in motion and promotes and practises social behaviour among them.</p><p>Through guidance and imitation they learn age-appropriate interaction with their child. Important here are suitable play materials, daily time in the fresh air and plenty of exercise. Expectations and demands placed on the child are monitored and discussed.</p>`]},
psych:{
de:['Psychologische Zielsetzung',`<p>In der psychologischen Arbeit wird den Bewohnerinnen auf individueller Ebene geholfen, Chancen und Risiken ihrer Impulse zu erkennen und quasi "innere Kompromisse" zu finden, die sie als Gesamtpersönlichkeit tragen und auch langfristig umsetzen können. Nach solchen angeleiteten Schritten der klientenzentrierten Selbstexploration wird die praktische Umsetzung von konkreten Zielvorhaben der jungen Frauen psychologisch begleitet. Neben Motivationshilfen werden Veränderungen (und Resistenzen) innerhalb ihrer Zusammenhänge thematisiert und mögliche Handlungsalternativen durchgespielt. Hierbei helfen die persönlichen Rückmeldungen (und ggf. technische Aufzeichnungen) den jungen Frauen, Diskrepanzen von Selbstwahrnehmung und Fremdwahrnehmung aufzudecken und zu korrigieren.</p><p>Ferner werden die Klientinnen für interessante entwicklungspsychologische Schritte ihrer Kinder in bestimmten Altersstufen sensibilisiert, was der Mutter-Kind-Beziehung dienlich ist.</p>`],
en:['Psychological goals',`<p>In psychological work, residents are helped individually to recognise the opportunities and risks of their impulses and to find "inner compromises" that they can carry as a whole personality and implement in the long term. After such guided steps of client-centred self-exploration, the practical implementation of the young women's concrete goals is accompanied psychologically. Besides motivational help, changes (and resistance) within their contexts are addressed and possible alternative actions are played through. Personal feedback (and, where applicable, technical recordings) helps the young women uncover and correct discrepancies between self-perception and how others perceive them.</p><p>Clients are also made aware of interesting developmental steps of their children at certain ages, which benefits the mother-child relationship.</p>`]},
grund:{
de:['Grundleistungen nach §5 der Rahmenvereinbarung / §19 SGB VIII',`<ul><li>Kontinuierlicher Tagesablauf</li><li>Begleitung bei der Geburt/Schwangerschaftsberatung</li><li>Pädagogische Einzel- und Gruppengespräche</li><li>Altersgemäße Förderangebote für die Kinder durch päd. wertvolles Spielmaterial, Turnen etc.</li><li>Anleitung der jungen Mutter zur altersgemäßen Erziehung</li><li>Hilfen in lebenspraktischen Bereichen wie Haushaltsführung oder Umgang mit Geld</li><li>Anlegen eines Sparbuches, um gezielt mit den jungen Frauen das Erziehungsgeld einzusetzen</li><li>Bewusste Auseinandersetzung im hygienischen/pflegerischen und erzieherischen Bereich</li><li>Hausaufgabenhilfe</li><li>Betreuung der Kinder bei Abwesenheit der Mütter</li><li>Partner- und Angehörigenarbeit</li><li>Verpflegung für Mutter und Kind</li><li>Wohnung: 2 Zimmer, Flur, Bad</li><li>Gemeinschaftsküche</li><li>Hauswirtschaftsraum</li><li>Vorratsraum</li><li>Krabbel- und Spielzimmer</li><li>Sport- und Freizeitraum</li><li>Betreuung der Kinder während der Schul- und Ausbildungszeit</li><li>Fahrtkosten für Einkäufe, Arzt- und Schulbesuche</li><li>Hilfeplankonferenzen 2x jährlich</li><li>Zusammenarbeit mit dem Pflege- und Adoptionsdienst</li><li>Bei Auszug Begleitung bei der Wohnungssuche, Möbelbeschaffung und Umzug</li><li>Behördengänge</li></ul>`],
en:['Basic services under §5 of the framework agreement / §19 SGB VIII',`<ul><li>Continuous daily routine</li><li>Support during birth / pregnancy counselling</li><li>Individual and group educational talks</li><li>Age-appropriate activities for the children through educationally valuable play materials, gymnastics etc.</li><li>Guidance for the young mother on age-appropriate parenting</li><li>Help with practical life skills such as housekeeping or handling money</li><li>Setting up a savings book to use the child-raising allowance purposefully with the young women</li><li>Conscious engagement with hygiene / care and parenting topics</li><li>Homework help</li><li>Childcare while the mothers are absent</li><li>Work with partners and relatives</li><li>Meals for mother and child</li><li>Apartment: 2 rooms, hallway, bathroom</li><li>Shared kitchen</li><li>Utility room</li><li>Storage room</li><li>Crawling and play room</li><li>Sports and leisure room</li><li>Childcare during school and training time</li><li>Travel costs for shopping, doctor and school visits</li><li>Support plan conferences twice a year</li><li>Cooperation with the foster care and adoption service</li><li>When moving out: support with finding an apartment, obtaining furniture and moving</li><li>Official errands</li></ul>`]},
qual:{
de:['Qualitätssicherung',`<p>Die Qualitätssicherung erfasst u.a. die Dokumentation über Krankheiten der Kinder, Kinderarztbesuche und Krankenhausaufenthalte. Ferner werden Tagesabläufe und besondere Ereignisse dokumentiert. Bei den täglichen Übergaben informieren sich die diensthabenden Mitarbeiter gegenseitig.</p><p>Neben Fortbildung unserer Mitarbeiter erfolgen ferner weitere Maßnahmen zur Qualitätssicherung:</p><ul><li>Wöchentliche ausführliche Dienstbesprechung</li><li>Teamberatung und Einzelfallgespräche mit Unterstützung des Psychologen</li><li>Vorbereitung therapeutischer Hilfen für die jungen Erwachsenen durch den Psychologen</li><li>Regelmäßige Feedbacks der Bewohnerinnen über die inhaltliche Arbeit der MitarbeiterInnen</li><li>Dokumentation von Entwicklungsverläufen der Klientinnen.</li></ul><p>Die Qualitätssicherungsmaßnahmen erfolgen in standardisierter und offener Form. Standardisiert erhobene Daten werden deskriptiv aufbereitet. Bei Hinweisen auf spezielle Problemstellungen können auch weiter gehende statistische Analysen mit multivariaten Verfahren erfolgen.</p>`],
en:['Quality assurance',`<p>Quality assurance covers, among other things, documentation of the children's illnesses, paediatrician visits and hospital stays. Daily routines and special events are also documented. During daily handovers, the staff on duty inform each other.</p><p>In addition to staff training, further quality assurance measures are carried out:</p><ul><li>Detailed weekly staff meeting</li><li>Team consultation and individual case discussions with the support of the psychologist</li><li>Preparation of therapeutic help for the young adults by the psychologist</li><li>Regular feedback from residents on the content of the staff's work</li><li>Documentation of the clients' developmental progress.</li></ul><p>Quality assurance measures are carried out in standardised and open form. Standardised data are processed descriptively. If specific problems are indicated, more advanced statistical analyses with multivariate methods may also be carried out.</p>`]},
wir:{
de:['Wir über uns',`<p>Hier können Sie uns näher kennen lernen!</p><p>An dieser Stelle erfolgen in Kürze die persönliche Vorstellung unserer Mitarbeiter und Details zu ihrer Arbeitsweise.</p>`],
en:['About us',`<p>Here you can get to know us better!</p><p>Soon, this section will feature a personal introduction of our staff and details of how they work.</p>`]},

 document.getElementById('menuList').innerHTML=G.map((g,i)=>`<div class="mb ${i===1?'open':''}" id="mb${i}"><div class="mb-h" onclick="toggleMb(${i})"><span><span class="n">0${i+1}</span>${g[L]}</span><span>⌄</span></div><div class="mb-b">${g.k.map(k=>`<a onclick="go('${k}')"><span>${ptitle(k)}</span><span>↗</span></a>`).join('')}</div></div>`).join('');

function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('overlay').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('overlay').classList.remove('open')}

function go(k){closeDrawer();location.hash=k?'#'+k:'';if(!k)render()}

 const k=location.hash.slice(1),home=document.getElementById('home'),pg=document.getElementById('page');
 document.querySelectorAll('[data-ui]').forEach(e=>e.textContent=UI[e.dataset.ui][L]);
 document.querySelectorAll('[data-p]').forEach(e=>e.textContent=ptitle(e.dataset.p));
 document.getElementById('langBtn').textContent=L==='de'?'EN':'DE';
 document.documentElement.lang=L;
 buildMenu();
 if(k&&P[k]){
  home.style.display='none';pg.style.display='block';
  document.getElementById('pTitle').textContent=P[k][L][0];
  document.getElementById('pBody').innerHTML=k==='kontakt'?contactHtml():P[k][L][1];
  document.title=P[k][L][0]+' – Mutter-Kind-Haus Vechta';
 }else{
  home.style.display='block';pg.style.display='none';document.title='Mutter-Kind-Haus Vechta';
 }
 window.scrollTo(0,0);
}
function toggleLang(){L=L==='de'?'en':'de';try{localStorage.setItem('lang',L)}catch(e){}render()}
window.addEventListener('hashchange',render);
render();
